[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cee-sch-dashboard"
version = "0.1.0"
description = "Auditable CEE student credit hour proof of concept"
requires-python = ">=3.9"
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.0,<3",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

